<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Kapnanda Primary and Junior School Management System</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="login" class="login">
  <div class="loginbox">

    <div class="logo">K</div>

    <h1>Kapnanda Primary and Junior School</h1>
    <p>School Management System</p>

    <div class="field">
      <label for="loginUser">Email</label>
      <input
        id="loginUser"
        type="email"
        placeholder="admin@example.com"
        autocomplete="username"
      >
    </div>

    <div class="field" style="margin-top:12px">
      <label for="loginPass">Password</label>
      <input
        id="loginPass"
        type="password"
        placeholder="Enter your password"
        autocomplete="current-password"
      >
    </div>

    <button
      id="loginButton"
      style="width:100%;margin-top:16px"
      onclick="login()"
    >
      Sign In
    </button>

    <button
      class="light"
      style="width:100%;margin-top:9px"
      onclick="forgot()"
    >
      Forgot Password?
    </button>

    <small
      id="loginMode"
      style="display:block;text-align:center;color:#64748b;margin-top:14px"
    >
      Connecting to Supabase...
    </small>

    <div
      id="loginError"
      style="
        display:none;
        margin-top:12px;
        padding:10px;
        border-radius:8px;
        background:#fee2e2;
        color:#991b1b;
        font-size:14px;
      "
    ></div>

  </div>
</div>


<!-- ================= APPLICATION ================= -->

<div id="app" class="app hidden">

  <aside class="sidebar">

    <div class="brand">
      KAPNANDA PRIMARY & JUNIOR SCHOOL
      <small>School Management System</small>
    </div>

    <div class="sectiontag">Main</div>

    <div class="nav">
      <button data-page="Dashboard" onclick="show('Dashboard')">
        🏠 Dashboard
      </button>

      <button data-page="Learners" onclick="show('Learners')">
        👨‍🎓 Learners
      </button>

      <button data-page="Teachers" onclick="show('Teachers')">
        👩‍🏫 Teachers
      </button>
    </div>


    <div class="sectiontag">Academic</div>

    <div class="nav">
      <button data-page="Marks" onclick="show('Marks')">
        ✏️ Marks
      </button>

      <button data-page="Rankings" onclick="show('Rankings')">
        🏆 Rankings
      </button>

      <button data-page="Attendance" onclick="show('Attendance')">
        📋 Attendance
      </button>

      <button data-page="Reports" onclick="show('Reports')">
        📄 Reports
      </button>

      <button data-page="Performance" onclick="show('Performance')">
        📊 Performance
      </button>
    </div>


    <div class="sectiontag">Administration</div>

    <div class="nav">
      <button data-page="Fees" onclick="show('Fees')">
        💰 Fees
      </button>

      <button data-page="Timetable" onclick="show('Timetable')">
        📅 Timetables
      </button>

      <button data-page="Subjects" onclick="show('Subjects')">
        📚 Subjects
      </button>

      <button data-page="Settings" onclick="show('Settings')">
        ⚙️ Settings
      </button>
    </div>


    <div class="sectiontag">System</div>

    <div class="nav">
      <button onclick="backup()">
        💾 Backup
      </button>

      <button onclick="logout()">
        🚪 Logout
      </button>
    </div>

  </aside>


  <main class="main">

    <div class="top">

      <div>
        <h1 id="pageTitle">Dashboard</h1>

        <div id="period" class="small">
          Current academic period
        </div>

        <div
          class="small"
          style="margin-top:4px;color:#2563eb;font-weight:800"
        >
          System Version 2 • Term-aware fees & subjects
        </div>
      </div>


      <div class="toolbar no-print">

        <button class="light" onclick="backup()">
          Backup
        </button>

        <button onclick="window.print()">
          Print
        </button>

      </div>

    </div>


    <div id="content"></div>

  </main>

</div>


<!-- ================= MODAL ================= -->

<div id="modal" class="modal hidden">

  <div class="modalbox" id="modalBody"></div>

</div>


<!-- ================= TOAST ================= -->

<div id="toast" class="toast"></div>


<!-- ================= SUPABASE ================= -->

<script>

const SUPABASE_URL =
  "https://nrxstipepaevthkeuxoh.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_nk1h83XRYa-NdZKhgZfsig__0xG8CdM";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/*
 * Make the Supabase client available to app.js.
 */
window.supabaseClient = supabaseClient;


/*
 * Check whether Supabase is connected.
 */
async function checkSupabaseConnection() {

  const mode = document.getElementById("loginMode");

  try {

    const {
      data,
      error
    } = await supabaseClient.auth.getSession();

    if (error) {
      throw error;
    }

    mode.textContent =
      "Cloud mode — Supabase connected.";

    mode.style.color = "#16a34a";

    /*
     * If the user is already logged in,
     * show the application automatically.
     */
    if (data && data.session) {

      showApplication();

    }

  } catch (error) {

    console.error(
      "Supabase connection error:",
      error
    );

    mode.textContent =
      "Supabase connection error.";

    mode.style.color = "#dc2626";

  }

}


/*
 * SUPABASE LOGIN
 */
async function login() {

  const email =
    document.getElementById("loginUser").value.trim();

  const password =
    document.getElementById("loginPass").value;

  const errorBox =
    document.getElementById("loginError");

  const button =
    document.getElementById("loginButton");


  errorBox.style.display = "none";
  errorBox.textContent = "";


  if (!email || !password) {

    errorBox.textContent =
      "Please enter your email and password.";

    errorBox.style.display = "block";

    return;

  }


  button.disabled = true;
  button.textContent = "Signing in...";


  try {

    const {
      data,
      error
    } = await supabaseClient.auth.signInWithPassword({

      email: email,
      password: password

    });


    if (error) {

      throw error;

    }


    if (!data.session) {

      throw new Error(
        "Login succeeded but no active session was returned."
      );

    }


    showApplication();


  } catch (error) {

    console.error("Login error:", error);

    errorBox.textContent =
      error.message ||
      "Login failed. Check your email and password.";

    errorBox.style.display = "block";

  } finally {

    button.disabled = false;
    button.textContent = "Sign In";

  }

}


/*
 * SHOW APPLICATION
 */
function showApplication() {

  document
    .getElementById("login")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");

  if (typeof show === "function") {

    show("Dashboard");

  }

}


/*
 * LOGOUT
 */
async function logout() {

  try {

    await supabaseClient.auth.signOut();

  } catch (error) {

    console.error(
      "Logout error:",
      error
    );

  }

  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("login")
    .classList.remove("hidden");

  document
    .getElementById("loginPass")
    .value = "";

}


/*
 * PASSWORD RESET
 */
async function forgot() {

  const email =
    document.getElementById("loginUser").value.trim();

  const errorBox =
    document.getElementById("loginError");


  errorBox.style.display = "none";


  if (!email) {

    errorBox.textContent =
      "Enter your email address first.";

    errorBox.style.display = "block";

    return;

  }


  try {

    const {
      error
    } = await supabaseClient.auth.resetPasswordForEmail(
      email,
      {
        redirectTo:
          window.location.origin +
          window.location.pathname
      }
    );


    if (error) {

      throw error;

    }


    alert(
      "Password reset instructions have been sent to your email."
    );


  } catch (error) {

    console.error(
      "Password reset error:",
      error
    );

    errorBox.textContent =
      error.message ||
      "Unable to send password reset email.";

    errorBox.style.display = "block";

  }

}


/*
 * Keep the old Configure Supabase function from
 * breaking the page if app.js still calls it.
 */
function cloudSetup() {

  alert(
    "Supabase is already configured for this school system."
  );

}


/*
 * Start Supabase.
 */
checkSupabaseConnection();

</script>


<!-- Existing application logic -->
<script src="app.js"></script>

</body>
</html>
